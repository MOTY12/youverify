services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  customer-service:
    build:
      context: .
      dockerfile: ./customer-service/Dockerfile
    container_name: customer-service
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/customer_db
      ORDER_SERVICE_URL: http://order-service:3003
      SEED_DATA: 'true'
    depends_on:
      mongodb:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - '3001:3001'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  product-service:
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongodb:27017/product_db
      SEED_DATA: 'true'
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '3002:3002'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongodb:27017/order_db
      PRODUCT_SERVICE_URL: http://product-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3004
    depends_on:
      mongodb:
        condition: service_healthy
      product-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - '3003:3003'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  payment-service:
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongodb:27017/payment_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_QUEUE: transactions
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '3004:3004'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  transaction-worker:
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    container_name: transaction-worker
    restart: unless-stopped
    command: node payment-service/worker.js
    environment:
      MONGO_URI: mongodb://mongodb:27017/payment_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_QUEUE: transactions
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:
